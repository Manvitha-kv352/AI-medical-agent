services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./medical_db:/app/medical_db
      - ./evaluation/results:/app/evaluation/results
      - ./prompts:/app/prompts
    networks:
      - medical-research-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - medical-research-network

networks:
  medical-research-network:
    driver: bridge
